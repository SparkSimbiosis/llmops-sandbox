name: eval-gate
# Шаблон для студентського репозиторію (корінь = вміст starter/).
# Піднімає стек, ганяє evals проти сервісу, блокує regression на pull request.
on:
  pull_request:

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # найдешевше — першим (L11): юніт-тести курсу й dev-агента, включно з тестами ізоляції агента від курсу.
      # Без стека, за хвилину; падіння тут зупиняє гейт до збірки образів.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (pytest, без стека)
        run: |
          pip install -r requirements-dev.txt
          pytest -q -p no:cacheprovider tests

      - name: UI tests dev-агента (node)
        run: for f in tests/agent/*.js; do echo "$f"; node "$f"; done

      - name: Up stack (без UI — для evals не потрібен)
        run: docker compose up -d --build service

      - name: Wait for service
        run: |
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8080/health; then exit 0; fi
            sleep 5
          done
          echo "service did not become healthy"
          docker compose logs
          exit 1

      - name: Wait for gateway (холодний LiteLLM дає 500 на перший запит)
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:4000/v1/chat/completions \
              -H "Content-Type: application/json" \
              -d '{"model":"mock","messages":[{"role":"user","content":"hi"}]}' || true)
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 5
          done
          echo "gateway not ready"
          docker compose logs gateway
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # поріг 12/13 = 85% від N угору (правило hw5, N=13 > 10); зламаний промпт (v1) дає 9/13 і пробиває;
      # будь-який expect_refusal-кейс блокує окремо (run.py). Той самий поріг — у README («Поріг evals»).
      # Крок не глушиться: червоний чек має блокувати merge (branch protection на чек eval).
      - name: Evals
        env:
          SERVICE_URL: http://localhost:8080
        run: python evals/run.py --dataset evals/golden.jsonl --threshold 12

      - name: Logs on failure
        if: failure()
        run: docker compose logs

      - name: Down
        if: always()
        run: docker compose down -v
