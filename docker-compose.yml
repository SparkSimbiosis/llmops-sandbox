services:
  ui:
    build: ./ui
    ports: ["4200:4200"]
    depends_on: [service]

  service:
    build:
      context: .
      dockerfile: Dockerfile.service
    ports: ["8080:8080"]
    environment:
      - GATEWAY_URL=http://gateway:4000
      - DATABASE_URL=postgresql://llmops:llmops@postgres:5432/llmops
      - MODEL=${MODEL:-mock}   # mock (за замовч.) або gpt-5-mini / claude-haiku (потрібен ключ у gateway/.env)
      - BUDGET_USD=${BUDGET_USD:-5.0}
      # реальна модель (опційно): порожньо = усе на mock; REAL_MODEL=deepseek-chat вмикає третій маршрут
      - REAL_MODEL=${REAL_MODEL:-}
      - REAL_BUDGET_USD=${REAL_BUDGET_USD:-1.0}
      # (опц.) semantic cache: SEMANTIC_CACHE=1 + docker compose --profile advanced (redis, embeddings)
      - SEMANTIC_CACHE=${SEMANTIC_CACHE:-0}
    depends_on: [gateway, postgres]

  gateway:
    # nightly-тег рухомий — пінимо перевірений digest, щоб у всіх студентів був той самий gateway
    image: ghcr.io/berriai/litellm:main-latest@sha256:80ea654c506da9083503d00c1b323b2fecddf17af6add9bf01b2603938e17bd2
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports: ["4000:4000"]
    volumes:
      - ./gateway/litellm-config.yaml:/app/config.yaml:ro
    # ключі провайдерів — лише тут, і лише з файлу (для mock він не потрібен,
    # тому required: false). НЕ дублюй їх у environment: той має вищий
    # пріоритет і перебив би env_file порожнім значенням.
    env_file:
      - path: gateway/.env
        required: false
    depends_on: [mock-provider]

  mock-provider:
    build: ./mock-provider
    expose: ["9000"]

  postgres:
    image: postgres:16
    environment:
      - POSTGRES_USER=llmops
      - POSTGRES_PASSWORD=llmops
      - POSTGRES_DB=llmops
    ports: ["5432:5432"]
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
      - pgdata:/var/lib/postgresql/data

  # --- optional (advanced): docker compose --profile advanced up ---
  redis:
    image: redis:7
    profiles: ["advanced"]
    ports: ["6379:6379"]

  # (опц.) локальна модель ембеддингів для semantic cache: багатомовна (є українська), без зовнішніх ключів.
  # Перший старт завантажує модель (~0.5 GB) у том hfcache.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    profiles: ["advanced"]
    command: ["--model-id", "intfloat/multilingual-e5-small", "--port", "80"]
    volumes:
      - hfcache:/data

  # (опц. hw6) /metrics + зовнішній дашборд: Prometheus (http://localhost:9090) і Grafana (http://localhost:3000,
  # дашборд «LLMOps sandbox» підключається сам). Лише в profile advanced.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["advanced"]
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["advanced"]
    ports: ["3000:3000"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true          # навчальний стенд: перегляд без логіна, лише локально
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  pgdata:
  hfcache:
